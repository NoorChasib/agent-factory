name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run validate

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: 1.3.14
      - name: Lint installer script
        run: shellcheck install.sh
      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$(whoami)"
          for _ in $(seq 1 15); do
            if XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user show-environment >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The systemd user manager did not become available."
          exit 1
      - name: Run installer prerequisite checks
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          AGENT_FACTORY_INSTALL_CHECK_ONLY=1 bash install.sh
