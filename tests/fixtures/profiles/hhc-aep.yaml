schemaVersion: 1
id: hhc-aep
enabled: true
repository: NoorChasib/HHC-AEP
defaultBranch: main
workflow:
  implement: hhc-aep-agent-implement-issue
  feedback: hhc-aep-agent-converge-pr
  operatorImplement: hhc-aep-operator-implement-issue
  operatorFeedback: hhc-aep-operator-converge-pr
labels:
  needsTriage: needs-triage
  needsInfo: needs-info
  implementationReady: ready-for-implementation-agent
  operatorReady: ready-for-human
  inProgress: in-progress
  feedbackReady: ready-for-feedback-agent
  readyToMerge: ready-to-merge
  workerStalled: worker-stalled
  reviewStalled: review-stalled
  needsRespec: needs-respec
  blockedExternal: blocked-external
reviewPolicy:
  required: [codex, copilot]
  optionalOwnerLabel: claude-review
defaultBranchProtection:
  requiresPullRequest: true
  requiredApprovingReviewCount: 0
  dismissesStaleReviews: true
  requiresCodeOwnerReviews: false
  requiresConversationResolution: true
  requiresStatusChecks: true
  prohibitsForcePushes: true
  prohibitsDeletions: true
requiredChecks:
  source: branch-protection
  requireCurrentHead: true
  checks: []
reviewers:
  codex:
    identity:
      kind: github-app
      login: codex
    completionSignal:
      kind: pull-request-review
  copilot:
    identity:
      kind: github-app
      login: github-copilot
    completionSignal:
      kind: pull-request-review
issueSelection:
  owner: project-workflow
  controllerProvidesIssueNumber: false
timeouts:
  reviewerMinutes: 45
  requiredCheckMinutes: 90
  quiescencePolls: 2
ceilings:
  implementation: 1
  feedback: 1
  readyToMerge: 1
